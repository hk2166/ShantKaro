[project]
name = "shant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hk2166", email = "9610hemant@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "gnani-vachana>=0.8.1",
    "pipecat-ai[runner,silero,webrtc]==1.5.0",
    "pipecat-gnani>=0.5.12",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "websockets>=15",
]

[project.scripts]
shant = "shant.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "sounddevice>=0.5.6",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

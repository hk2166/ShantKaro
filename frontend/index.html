<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shant Karo · calm the angry customer</title>
    <meta name="description" content="A voice training game: calm an angry, code-mixed AI customer in three minutes without breaking company policy." />
    <meta name="theme-color" content="#3d3bd1" />
    <script>
      // shadcn themes switch on a .dark class; follow the system setting.
      const media = window.matchMedia('(prefers-color-scheme: dark)')
      const apply = () => document.documentElement.classList.toggle('dark', media.matches)
      apply()
      media.addEventListener('change', apply)
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
